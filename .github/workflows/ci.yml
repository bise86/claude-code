name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # 钉死版本。这个仓库对 bun 的行为是有依赖的(打包器、vendored ink 的渲染时序、
          # `import type` 被擦除因而没有类型检查),浮动版本会让 CI 和本地在不同的地基上跑。
          bun-version: 1.3.14

      - name: 安装依赖
        # --frozen-lockfile:CI 不该悄悄改锁文件。锁文件对不上就红,而不是自己解决。
        run: bun install --frozen-lockfile

      - name: 跑测试
        # `bun test` 是这个仓库**唯一**的门禁 —— 没有 typecheck(`import type` 被 bun 擦除),
        # 所以一个类型层面的错误只有在跑起来时才会暴露。
        run: bun test

      - name: 打包能过
        # 单独一步:打包会因为「源码里能跑、bundler 静态解析不了」的可选导入而失败,
        # 而那种失败在 `bun test` 里完全看不见。
        run: bun run build

      - name: 打包态自检
        # 这一步守的是**只有编成单文件产物之后才会出现**的一类故障:虚拟路径被当成真路径
        # 去 spawn、NODE_ENV 被编译期内联成 development、ripgrep 解析到一条不存在的路径。
        # 它们在 `bun test` 里一条都看不见 —— 源码态全绿、产物是坏的。
        #
        # 之前这道门禁只在有人**手动**跑时才存在:全仓 grep 不到任何引用,而 build.ts 的
        # 注释还写着「CI 里 build → verify → upload」,描述的是一条不存在的流水线。
        run: bun run verify:binary
