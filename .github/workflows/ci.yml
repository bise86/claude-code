name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # 钉死版本。这个仓库对 bun 的行为是有依赖的(打包器、vendored ink 的渲染时序、
          # `import type` 被擦除因而没有类型检查),浮动版本会让 CI 和本地在不同的地基上跑。
          bun-version: 1.3.14

      - name: 安装依赖
        # --frozen-lockfile:CI 不该悄悄改锁文件。锁文件对不上就红,而不是自己解决。
        run: bun install --frozen-lockfile

      - name: 装 ripgrep
        # **这一步是给下面「打包态自检」的,不是给 `bun test` 的。**
        #
        # `bun test` 已经不依赖它了:`ripgrepMissing.test.ts` 自带 rg 桩子,屏蔽掉系统 rg
        # 跑全量仍是 3304 pass / 0 fail(只屏蔽 rg,git 等照常在)。
        #
        # 但 `verify:binary` 有一条「打包态里**真的能搜出文件**」——它跑的是编出来的单文件
        # 产物,而那个产物在这台机器上只能走 `mode: 'system'`(`vendor/ripgrep` 不在 git 里),
        # 也就是靠 PATH 上的 rg。拿桩子去满足它等于把这道门禁变成空转:它要守的正是
        # 「虚拟路径被当成真路径去 spawn」「ripgrep 解析到一条不存在的路径」这类**只有编成
        # 产物之后才会出现**的故障,而这些只有真的搜出文件才证得了。
        #
        # 注意这道门禁**证明不了**「发出去的二进制自带 rg」——它证明的是解析与 spawn 的逻辑
        # 对。产物在没装 rg 的用户机器上搜索仍然不可用,那是 vendor/ripgrep 为空的问题,
        # 不在这一步的射程内。
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: 跑测试
        # `bun test` 是这个仓库**唯一**的门禁 —— 没有 typecheck(`import type` 被 bun 擦除),
        # 所以一个类型层面的错误只有在跑起来时才会暴露。
        run: bun test

      - name: 打包能过
        # 单独一步:打包会因为「源码里能跑、bundler 静态解析不了」的可选导入而失败,
        # 而那种失败在 `bun test` 里完全看不见。
        run: bun run build

      - name: 打包态自检
        # 这一步守的是**只有编成单文件产物之后才会出现**的一类故障:虚拟路径被当成真路径
        # 去 spawn、NODE_ENV 被编译期内联成 development、ripgrep 解析到一条不存在的路径。
        # 它们在 `bun test` 里一条都看不见 —— 源码态全绿、产物是坏的。
        #
        # 之前这道门禁只在有人**手动**跑时才存在:全仓 grep 不到任何引用,而 build.ts 的
        # 注释还写着「CI 里 build → verify → upload」,描述的是一条不存在的流水线。
        run: bun run verify:binary
