name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: claude-haha-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            asset: claude-haha-darwin-arm64
          # macos-13 / bun-darwin-x64 那一档去掉了 —— 它一直跑不过,而它是**唯一**跑在
          # Intel mac 跑机上的一档。留着的代价是每次发布都要等它失败或被人工取消,
          # 而 fail-fast: false 意味着其余三档照常产出、release 那一步照常能发。
          #
          # 后果要说清:**从此不再发 Intel mac 的二进制**。那批用户拿不到 release 产物,
          # 只能从源码跑(`bun run ./bin/claude-haha`)。Apple 从 2020 年起转 arm,
          # 而 arm64 那一档还在。真要把它找回来,先解决那台跑机上的编译失败,
          # 再把这三行加回来 —— 别直接把 os 换成 macos-latest,那样产出的是 arm64 的二进制、
          # 名字却写着 x64,冒烟测试还照样绿(它在 arm 跑机上跑 arm 产物)。
          - os: windows-latest
            target: bun-windows-x64
            asset: claude-haha-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: 编译单文件二进制
        shell: bash
        env:
          # 版本号取自 tag,而不是 preload 里那个占位值 —— 用户 `--version` 看到的
          # 必须和他下载的那个 release 对得上。
          CLAUDE_CODE_LOCAL_VERSION: ${{ github.ref_name }}
        run: bun run scripts/build.ts --compile --target ${{ matrix.target }} --outfile ${{ matrix.asset }}

      - name: 冒烟测试 —— 发出去的东西必须能跑
        # 不测就发 = 把「构建成功」当成「能用」。这个仓库正好踩过两次:一次打包报告成功
        # 而产物一跑就 ReferenceError,一次报告「已编译」而产物落在了另一个目录。
        shell: bash
        run: |
          set -euo pipefail
          BIN="./${{ matrix.asset }}"
          "$BIN" --version
          "$BIN" --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -lh artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
