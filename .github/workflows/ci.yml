name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # 钉死版本。这个仓库对 bun 的行为是有依赖的(打包器、vendored ink 的渲染时序、
          # `import type` 被擦除因而没有类型检查),浮动版本会让 CI 和本地在不同的地基上跑。
          bun-version: 1.3.14

      - name: 安装依赖
        # --frozen-lockfile:CI 不该悄悄改锁文件。锁文件对不上就红,而不是自己解决。
        run: bun install --frozen-lockfile

      - name: 装 ripgrep
        # 搜索是这个产品的地基:`ripGrep` 先找 `vendor/ripgrep`,找不到就退到系统 PATH 上的
        # `rg`,两个都没有就整个不可用。而 `vendor/ripgrep` **不在 git 里**(git ls-files 为空),
        # 所以 CI 上只剩系统那一条路 —— 跑机默认没有 rg,于是 ripgrepMissing.test.ts 的自检
        # (「PATH 正常时搜索是能用的」)必然红。
        #
        # 装它而不是把那条自检去掉:那条自检存在的理由就是防止同一个文件里的第二条用例
        # (「没有 rg 时模型收到的是一句能照做的话」)因为**机器上压根没有 rg** 而假绿 ——
        # 那时它期望的失败会因为错误的原因发生。去掉自检等于把这个仓库反复在修的
        # 「探针坏了被记成覆盖」再犯一次。
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: 跑测试
        # `bun test` 是这个仓库**唯一**的门禁 —— 没有 typecheck(`import type` 被 bun 擦除),
        # 所以一个类型层面的错误只有在跑起来时才会暴露。
        run: bun test

      - name: 打包能过
        # 单独一步:打包会因为「源码里能跑、bundler 静态解析不了」的可选导入而失败,
        # 而那种失败在 `bun test` 里完全看不见。
        run: bun run build

      - name: 打包态自检
        # 这一步守的是**只有编成单文件产物之后才会出现**的一类故障:虚拟路径被当成真路径
        # 去 spawn、NODE_ENV 被编译期内联成 development、ripgrep 解析到一条不存在的路径。
        # 它们在 `bun test` 里一条都看不见 —— 源码态全绿、产物是坏的。
        #
        # 之前这道门禁只在有人**手动**跑时才存在:全仓 grep 不到任何引用,而 build.ts 的
        # 注释还写着「CI 里 build → verify → upload」,描述的是一条不存在的流水线。
        run: bun run verify:binary
